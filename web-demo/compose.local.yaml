services:
  theadoc:
    build:
      context: .
      args:
        VITE_SYNC_URL: ws://localhost:3030
    restart: unless-stopped
    environment:
      APP_PORT: 3000
      SYNC_PORT: 3030
      DATA_DIR: /data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.6-terra}
    ports:
      - "3000:3000"
      - "3030:3030"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
