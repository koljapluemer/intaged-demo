services:
  theadoc:
    build:
      context: .
      args:
        VITE_SYNC_URL: wss://${SYNC_DOMAIN}
    restart: unless-stopped
    environment:
      APP_PORT: 3000
      SYNC_PORT: 3030
      DATA_DIR: /data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5.6-terra}
    volumes:
      - ./data:/data
    expose:
      - "3000"
      - "3030"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      theadoc:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SYNC_DOMAIN: ${SYNC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
